name: Gerar AAB assinado

on:
  workflow_dispatch:
    inputs:
      test_ads:
        description: "Usar anuncios de exemplo do Google (marque no teste fechado)"
        type: boolean
        default: true

jobs:
  build:
    name: Build e assinatura do AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar AAB
        run: ./gradlew :app:bundleRelease -PversionCode=${{ github.run_number }} ${{ inputs.test_ads && '-PtestAds=true' || '' }}

      - name: Assinar AAB
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/upload.jks"
          jarsigner -keystore "$RUNNER_TEMP/upload.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEY_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            app/build/outputs/bundle/release/app-release.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Guardar AAB
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-br-aab
          path: app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
