name: Gerar APK de teste

on:
  workflow_dispatch:

jobs:
  build:
    name: Build do APK de teste
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK (debug, com anuncios de exemplo do Google)
        run: ./gradlew :app:assembleDebug -PversionCode=${{ github.run_number }}

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: sudoku-br-apk-teste
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
